name: Capture real Streamlit demonstration UI
on:
  pull_request:
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start Streamlit in demo-only mode
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > streamlit.log 2>&1 &
      - name: Capture genuine initial screen
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import time
          from urllib.request import urlopen
          from playwright.sync_api import sync_playwright
          for attempt in range(60):
              try:
                  with urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("Streamlit not ready; inspect log artifact")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto("http://127.0.0.1:8501", wait_until="domcontentloaded", timeout=60000)
              page.get_by_text("Smart Emergency Incident Response System", exact=False).first.wait_for(state="visible", timeout=120000)
              page.screenshot(path="artifacts/streamlit-homepage.png", full_page=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emergency-streamlit-real-ui
          path: |
            artifacts/streamlit-homepage.png
            streamlit.log
