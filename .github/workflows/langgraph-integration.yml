name: LangGraph fanout and fanin integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LangGraph only (no LLM secrets needed)
        run: python -m pip install "langgraph>=1,<2"
      - name: Run graph topology integration and authorization checks
        run: |
          mkdir -p artifacts
          python -m unittest discover -s tests -p 'test_graph_integration.py' -v 2>&1 | tee artifacts/graph-test.log
          test ${PIPESTATUS[0]} -eq 0
          python -m unittest discover -s tests -p 'test_repository_layout.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emergency-graph-integration
          path: artifacts/graph-test.log
