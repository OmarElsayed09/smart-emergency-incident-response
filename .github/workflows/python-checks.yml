name: Python syntax and import checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Check graph imports
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("graph.py").read_text(encoding="utf-8")
          assert "from agents." not in source
          for name in ["incident_agent", "map_agent", "knowledge_rag", "resource_agent", "decision_agent", "safety_checker", "evidence_verifier", "human_approval_agent", "action_plan_agent"]:
              assert Path(name + ".py").is_file()
          PY
