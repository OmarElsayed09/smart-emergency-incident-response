name: Python syntax and repository tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Test repository layout and action-plan authorization
        run: python -m unittest discover -s tests -p 'test_repository_layout.py' -v
